services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    network_mode: host
    command: --port=3307 --mysqlx-port=33061
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hotel_booking
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3307", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  eureka-server:
    image: hotelbookingmicroservice-eureka-server:latest
    container_name: eureka-server
    network_mode: host
    restart: always

  booking-service:
    image: hotelbookingmicroservice-booking-service:latest
    container_name: booking-service
    network_mode: host
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://127.0.0.1:3307/booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      mysql-db:
        condition: service_healthy
    restart: on-failure

  inventory-service:
    image: hotelbookingmicroservice-inventory-service:latest
    container_name: inventory-service
    network_mode: host
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://127.0.0.1:3307/hotel_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      mysql-db:
        condition: service_healthy
    restart: on-failure

  api-gateway:
    image: hotelbookingmicroservice-api-gateway:latest
    container_name: api-gateway
    network_mode: host
    depends_on:
      - eureka-server
    restart: always

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    network_mode: host
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HTTP_PORT=8081
    volumes:
      - ./keycloak-db:/opt/keycloak/data/h2
    command: start-dev
    restart: always

  frontend-ui:
    image: hotelbookingmicroservice-frontend-ui:latest
    container_name: frontend-ui
    network_mode: host
    depends_on:
      - api-gateway
      - keycloak
    restart: always