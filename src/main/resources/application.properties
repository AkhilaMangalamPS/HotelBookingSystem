spring.application.name=HotelReservationSystem
server.port=8080

# MySQL Database Configuration (Port 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/hotel_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Rules
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration Core Configurations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT Secret Configuration
app.jwt.secret=9a4f2c8d3e1b7f6a5c4d3b2a1e0f9c8b7a6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c
app.jwt.expiration-ms=86400000

# Session Cookie Configuration (Expires when browser closes)
server.servlet.session.cookie.max-age=-1

#Redis connection Settings
spring.data.redis.host=localhost
spring.data.redis.port=6380

#cache configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=10m

#Prevents caching null values if a hotel/rate doesnt eixst
spring.cache.redis.cache-null-values=false



