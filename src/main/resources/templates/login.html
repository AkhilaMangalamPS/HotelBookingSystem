<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:inline="javascript">
<head>
    <meta charset="UTF-8">
    <title>Hotel Reservation - Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
<div class="card p-4 shadow-sm" style="width: 400px;">
    <h3 class="text-center mb-3 text-primary">Hotel Portal</h3>
    <div th:if="${param.error}" class="alert alert-danger py-2 small">Invalid username or password</div>
    <div th:if="${param.logout}" class="alert alert-success py-2 small">Logged out successfully</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-bold">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Enter username" required>
        </div>
        <div class="mb-3">
            <label class="form-label small fw-bold">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>


        </div>
        <button type="submit" class="btn btn-primary w-100">Sign In</button>
    </form>

</div>
</body>
</html>
