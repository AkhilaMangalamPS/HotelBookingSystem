<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Miami Hotels - Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
<div class="card p-4 shadow-sm" style="width: 400px;">
    <h3 class="text-center mb-3 text-success">Create Account</h3>

    <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success py-2 small" th:text="${success}"></div>

    <form th:action="@{/register}" th:object="${authRequest}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-bold">Username</label>
            <input type="text" th:field="*{username}" class="form-control" placeholder="Choose a username" required />
        </div>
        <div class="mb-3">
            <label class="form-label small fw-bold">Password</label>
            <input type="password" th:field="*{password}" class="form-control" placeholder="Create password" required />
        </div>
        <div class="mb-3">
            <label class="form-label small fw-bold">Account Loyalty Tier</label>
            <select th:field="*{customerType}" class="form-select" required>
                <option value="REGULAR">Regular Customer</option>
                <option value="REWARDS">Rewards Member</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label small fw-bold">Account Role</label>
            <select th:field="*{role}" class="form-select" required>
                <option value="ROLE_USER">Standard User (Book Rooms)</option>
                <option value="ROLE_ADMIN">Administrator (Manage Hotels)</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success w-100 fw-bold">Sign Up</button>
        <p class="text-center small mt-3 mb-0">Already have an account? <a href="/login">Log In</a></p>
    </form>
</div>
</body>
</html>
